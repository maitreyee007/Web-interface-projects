<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-wrap">
      <section class="profile-card" aria-label="Student profile card">
        <div class="card-top">
          <div class="badge">Student</div>
          <button class="icon-btn" aria-label="Add to favorites" id="favoriteBtn">
            <span id="favoriteIcon">♡</span>
          </button>
        </div>

        <div class="profile-header">
          <div class="avatar-wrap">
            <img
              src="mai3.png"
              alt="Student portrait"
            />
          </div>

          <div class="profile-info">
            <h1>Maitreyee J</h1>
            <p class="major">Computer Science</p>
            <div class="meta-row">
              <span>Year 3</span>
              <span>•</span>
              <span>CGPA 9.8</span>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <strong>24</strong>
            <span>Projects</span>
          </div>
          <div class="stat-box">
            <strong>12</strong>
            <span>Courses</span>
          </div>
          <div class="stat-box">
            <strong>8</strong>
            <span>Certs</span>
          </div>
        </div>

        <div class="about">
          <h2>About</h2>
          <p>
            Passionate about web development, machine learning, and building clean user
            experiences. Currently exploring full-stack projects and open source work.
          </p>
        </div>

        <div class="skills">
          <h2>Skills</h2>
          <div class="chip-list">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>React</span>
            <span>Python</span>
          </div>
        </div>

        <div class="actions">
          <button class="primary-btn" id="messageBtn">Message</button>
          <button class="secondary-btn" id="connectBtn">Connect</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
